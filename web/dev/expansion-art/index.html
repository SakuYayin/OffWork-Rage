<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>扩展美术动作检查</title><style>body{margin:0;background:#172334;color:#fff0d0;font:16px/1.5 'Microsoft YaHei',sans-serif}header{padding:18px 24px;background:#25364b;position:sticky;top:0}h1{font-size:22px;margin:0}button{margin:6px 8px 0 0;padding:8px 14px;background:#ffe08c;color:#422a3d;border:0;border-radius:4px;font:inherit;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px}article{background:#fff1d4;color:#422a3d;border-radius:8px;text-align:center;padding:10px}canvas{display:block;width:100%;height:180px;image-rendering:pixelated}h2{margin:0;font-size:17px}p{margin:3px;font-size:13px}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr)}}</style><header><h1>新增角色与怪物 · 原始图集动作检查</h1><div id="actions"></div><small>Agent辅助验收：只播放原始PNG裁切帧，脚点与固定身高按游戏元数据处理。此页不是战斗录像。</small></header><main id="tiles"></main><script>
(async()=>{const d=await(await fetch('../../assets/image/expansion/atlas-metadata.json')).json(),names={intern:'许宁 · 文件夹实习生',programmer:'周序 · IT程序员',charger:'撞门专员',spitter:'吐纸打印机',bomber:'爆炸闹钟',shieldGuard:'护盾保安',summoner:'召唤甲方',printerBoss:'打印机巨兽',femaleStapler:'林夏 · 订书器攻击'},labels={idle:'待机',walk:'左右走动',upWalk:'向上走动',downWalk:'向下走动',attack:'攻击',skill:'技能',defeat:'倒地'},tiles=[];let state='walk';for(const[key,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.state=key;b.onclick=()=>state=key;actions.append(b)}for(const[id,def]of Object.entries({...d.heroes,...d.enemies,...d.heroOverrides})){const im=new Image();im.src='../../assets/'+def.path;await im.decode();const a=document.createElement('article');a.innerHTML='<h2>'+names[id]+'</h2><canvas width="340" height="180"></canvas><p>透明像素 '+Math.round(def.transparentFraction*100)+'% · '+Object.values(def.frames).reduce((n,f)=>n+f.length,0)+'帧</p>';const tilesElement=document.querySelector('#tiles');tilesElement.append(a);tiles.push({def,im,ctx:a.querySelector('canvas').getContext('2d')})}function draw(t){for(const{def,im,ctx}of tiles){const frames=def.frames[state]||def.frames.idle||def.frames.attack,index=Math.floor(t/170)%frames.length,f=frames[index],scale=116/def.referenceHeight;ctx.clearRect(0,0,340,180);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#e7dac4';ctx.fillRect(14,160,312,1);ctx.drawImage(im,f.x,f.y,f.w,f.h,170-f.anchorX*scale,160-f.h*scale,f.w*scale,f.h*scale)}requestAnimationFrame(draw)}document.body.dataset.ready='true';requestAnimationFrame(draw)})().catch(e=>{document.body.dataset.error=e.message;throw e});
</script></html>
